services:
  postgres:
    image: postgres:16-alpine
    container_name: lucky-draw-postgres
    environment:
      POSTGRES_DB: luckydraw
      POSTGRES_USER: ${DB_USER:-luckydraw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luckydraw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luckydraw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lucky-draw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lucky-draw-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-luckydraw}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-luckydraw}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
