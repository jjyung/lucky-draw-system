spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: inventoryCommit;prizeStockConfigured
    stream:
      default:
        content-type: application/json
      bindings:
        inventoryCommit-in-0:
          destination: inventory-commit
          group: inventory-service
          consumer:
            max-attempts: 3
        prizeStockConfigured-in-0:
          destination: prize-stock-configured
          group: inventory-service
          consumer:
            max-attempts: 3

server:
  port: 8083

inventory:
  reconciliation:
    interval-ms: 300000
    reservation-timeout-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
