spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2
        - id: campaign-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/campaigns/**
          filters:
            - StripPrefix=2

server:
  port: 8080

gateway:
  rate-limit:
    user-rps: ${RATE_LIMIT_USER_RPS:10}
    ip-rps: ${RATE_LIMIT_IP_RPS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
