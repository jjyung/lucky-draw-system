spring:
  application:
    name: campaign-service
  datasource:
    url: jdbc:h2:mem:campaign;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: ${MQ_USER:luckydraw}
    password: ${MQ_PASSWORD:luckydraw}
  cloud:
    stream:
      bindings:
        inventoryCommit-out-0:
          destination: inventory-commit
          content-type: application/json
        prizeStockConfigured-out-0:
          destination: prize-stock-configured
          content-type: application/json

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
