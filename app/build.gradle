plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'org.openapi.generator' version '7.9.0' apply false
}

allprojects {
    group = 'com.luckydraw'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

ext {
    mapstructVersion = '1.6.2'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // 測試分層（§12.4）：unit 與 integration 分開跑，dev loop 不拖慢。
    // unit：`./gradlew test`（排除 @Tag("integration")，秒級）
    // integration：`./gradlew integrationTest`（Testcontainers，CI / pre-merge 跑）
    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs integration tests (Testcontainers).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'integration'
        }
        shouldRunAfter test
    }
}
