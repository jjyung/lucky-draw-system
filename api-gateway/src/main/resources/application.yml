spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: campaign-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/campaigns/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
